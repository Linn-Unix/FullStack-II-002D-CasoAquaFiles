# Blueprint de Render: crea el backend de AquaFiles desde el Dockerfile de backend/.
# En Render: New → Blueprint → elegir este repositorio. Las variables con "sync: false" se completan a mano.
services:
  - type: web
    name: aquafiles-backend
    runtime: docker
    plan: free
    # Rutas desde la raíz del repositorio: el backend está en la carpeta backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/verificacion
    autoDeploy: false
    envVars:
      # Base de datos MySQL en Aiven (ver docs/GUIA_DESPLIEGUE.md)
      - key: DB_URL
        sync: false
      - key: DB_USUARIO
        sync: false
      - key: DB_CLAVE
        sync: false
      # Render genera una clave aleatoria para firmar los JWT
      - key: JWT_SECRETO
        generateValue: true
      # URL de Vercel, sin "/" al final
      - key: CORS_ORIGENES
        sync: false
      # Clave de Groq (console.groq.com); sin ella la IA queda desactivada
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELO
        value: qwen/qwen3.8-27b
      # Usuarios y ofertas ficticias para la demostración
      - key: CREAR_USUARIOS_PRUEBA
        value: "true"
