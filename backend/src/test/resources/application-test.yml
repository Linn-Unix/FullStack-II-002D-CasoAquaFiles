# Perfil "test": se activa con @ActiveProfiles("test").
# Usa H2 en memoria con modo MySQL, así las pruebas no necesitan un servidor MySQL encendido.
spring:
  datasource:
    url: jdbc:h2:mem:aquafiles;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  jwt:
    secreto: clave-solo-para-pruebas-de-aquafiles-con-32-caracteres
  archivos:
    directorio: target/uploads-test
